<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="400" fill="#0f0f1e"/>
  
  <!-- Main chat window -->
  <rect x="40" y="30" width="420" height="280" rx="15" fill="#1a1a2e" stroke="#00d4ff" stroke-width="3"/>
  
  <!-- Chat header -->
  <rect x="40" y="30" width="420" height="50" rx="15" fill="url(#bgGrad)"/>
  <circle cx="60" cy="55" r="12" fill="#00ff00"/>
  <text x="85" y="62" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">NexaAI Support</text>
  
  <!-- Chat messages area -->
  <rect x="50" y="90" width="400" height="200" fill="#0a0a15" rx="10"/>
  
  <!-- Bot message 1 -->
  <rect x="70" y="110" width="280" height="40" rx="8" fill="#00d4ff"/>
  <text x="85" y="120" font-family="Arial, sans-serif" font-size="13" fill="#000" font-weight="bold">Hello! 👋</text>
  <text x="85" y="140" font-family="Arial, sans-serif" font-size="12" fill="#000">I'm your AI Support Assistant</text>
  
  <!-- Bot message 2 -->
  <rect x="70" y="160" width="320" height="50" rx="8" fill="#00d4ff"/>
  <text x="85" y="175" font-family="Arial, sans-serif" font-size="12" fill="#000">Ask me about:</text>
  <text x="85" y="193" font-family="Arial, sans-serif" font-size="11" fill="#000">• Projects  • Experience  • Skills</text>
  
  <!-- Input field -->
  <rect x="50" y="300" width="400" height="35" rx="8" fill="#0f3460" stroke="#00d4ff" stroke-width="2"/>
  <text x="65" y="325" font-family="Arial, sans-serif" font-size="13" fill="#666">Type your question...</text>
  
  <!-- Send button -->
  <circle cx="460" cy="317.5" r="12" fill="#00d4ff"/>
  <text x="460" y="323" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">→</text>
  
  <!-- Bot icon -->
  <g transform="translate(250, 360)">
    <!-- Head -->
    <rect x="-25" y="-25" width="50" height="50" rx="10" fill="#00d4ff"/>
    <!-- Eyes -->
    <circle cx="-10" cy="-10" r="4" fill="#000"/>
    <circle cx="10" cy="-10" r="4" fill="#000"/>
    <!-- Mouth -->
    <path d="M -8 8 Q 0 15 8 8" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="380" r="3" fill="#00d4ff" opacity="0.8"/>
  <circle cx="400" cy="350" r="2" fill="#00d4ff" opacity="0.6"/>
  <circle cx="470" cy="380" r="2.5" fill="#00d4ff" opacity="0.7"/>
</svg>